<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Scraper</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #111114;
    --surface2: #18181c;
    --border: #2a2a30;
    --border-focus: #3d5afe;
    --text: #e8e8ec;
    --text-dim: #6e6e78;
    --accent: #3d5afe;
    --accent-glow: rgba(61,90,254,0.15);
    --green: #00c853;
    --green-dim: rgba(0,200,83,0.12);
    --red: #ff1744;
    --red-dim: rgba(255,23,68,0.12);
    --yellow: #ffd600;
    --yellow-dim: rgba(255,214,0,0.1);
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    margin-bottom: 40px;
  }
  header h1 {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  header h1 span { color: var(--accent); }
  header p {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 6px;
  }

  /* Drop zone */
  .drop-zone {
    position: relative;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px 24px;
    min-height: 200px;
    transition: all 0.2s ease;
    background: var(--surface);
    cursor: text;
  }
  .drop-zone:focus-within,
  .drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-glow);
    box-shadow: 0 0 40px rgba(61,90,254,0.08);
  }
  .drop-zone-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
    pointer-events: none;
    transition: opacity 0.2s;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.8;
  }
  .drop-zone-label .icon {
    font-size: 32px;
    display: block;
    margin-bottom: 8px;
    opacity: 0.4;
  }
  .drop-zone-label kbd {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
  }
  .drop-zone.has-content .drop-zone-label { opacity: 0; }

  #site-input {
    width: 100%;
    min-height: 160px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.7;
    resize: vertical;
    position: relative;
    z-index: 1;
  }
  #site-input::placeholder { color: transparent; }

  /* Controls row */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .controls label {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .controls input[type="number"] {
    width: 60px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 6px 8px;
    text-align: center;
  }
  .controls input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.3px;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    margin-left: auto;
  }
  .btn-primary:hover { background: #536dfe; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .btn-clear {
    background: var(--surface2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-clear:hover { color: var(--text); border-color: var(--text-dim); }

  /* Results panel */
  .results {
    margin-top: 32px;
  }
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .results-header h2 {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
  }
  .run-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
  }

  .progress-bar-wrap {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Site cards */
  .site-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: center;
    font-size: 13px;
    transition: border-color 0.2s;
  }
  .site-card.status-ok { border-left: 3px solid var(--green); }
  .site-card.status-error { border-left: 3px solid var(--red); }
  .site-card.status-running { border-left: 3px solid var(--yellow); }
  .site-card.status-skipped { border-left: 3px solid var(--text-dim); }

  .site-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
  }
  .status-ok .site-status-dot { background: var(--green); box-shadow: 0 0 8px rgba(0,200,83,0.4); }
  .status-error .site-status-dot { background: var(--red); }
  .status-running .site-status-dot {
    background: var(--yellow);
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .site-info {
    min-width: 0;
  }
  .site-domain {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .site-meta {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-top: 2px;
  }
  .site-stats {
    text-align: right;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .site-stats .chars {
    color: var(--green);
    font-weight: 600;
  }

  /* Log feed */
  .log-feed {
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 240px;
    overflow-y: auto;
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.8;
    color: var(--text-dim);
  }
  .log-feed::-webkit-scrollbar { width: 6px; }
  .log-feed::-webkit-scrollbar-track { background: transparent; }
  .log-feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .log-entry { display: flex; gap: 10px; }
  .log-time { color: var(--text-dim); opacity: 0.5; flex-shrink:0; }
  .log-msg .ok { color: var(--green); }
  .log-msg .err { color: var(--red); }
  .log-msg .warn { color: var(--yellow); }

  /* Summary */
  .summary-bar {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    padding: 16px 20px;
    background: var(--surface2);
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .summary-stat { text-align: center; }
  .summary-stat .val {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .summary-stat .label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span>▸</span> site_scraper</h1>
    <p>Drop domains below, hit scrape. Output lands in <code style="font-family:var(--mono);color:var(--accent)">ALL_TEXT_FILES/</code></p>
  </header>

  <div class="drop-zone" id="drop-zone">
    <div class="drop-zone-label" id="drop-label">
      <span class="icon">⬇</span>
      Paste or type site domains here<br>
      <span style="font-size:12px">One per line, or space/comma separated</span>
    </div>
    <textarea id="site-input" placeholder="sonderenergy.com&#10;southerncurrentllc.com&#10;srenergy.com"></textarea>
  </div>

  <div class="controls">
    <label>pages/site <input type="number" id="max-pages" value="25" min="1" max="200"></label>
    <label>depth <input type="number" id="max-depth" value="2" min="1" max="5"></label>
    <label>timeout(s) <input type="number" id="max-seconds" value="90" min="10" max="600"></label>
    <label>workers <input type="number" id="max-workers" value="6" min="1" max="20"></label>
    <button class="btn btn-clear" onclick="clearAll()">Clear</button>
    <button class="btn btn-primary" id="scrape-btn" onclick="startScrape()">▶ Scrape</button>
  </div>

  <div class="results hidden" id="results-panel">
    <div class="results-header">
      <h2 id="results-title">Running…</h2>
      <span class="run-badge" id="run-badge"></span>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>

    <div id="site-cards"></div>

    <div class="summary-bar hidden" id="summary-bar">
      <div class="summary-stat"><div class="val" id="sum-sites">0</div><div class="label">Sites</div></div>
      <div class="summary-stat"><div class="val" id="sum-pages">0</div><div class="label">Pages</div></div>
      <div class="summary-stat"><div class="val" id="sum-chars">0</div><div class="label">Chars</div></div>
      <div class="summary-stat"><div class="val" id="sum-time">0s</div><div class="label">Time</div></div>
    </div>

    <div class="log-feed" id="log-feed"></div>
  </div>
</div>

<script>
const siteInput = document.getElementById('site-input');
const dropZone = document.getElementById('drop-zone');
const dropLabel = document.getElementById('drop-label');

// Track content for label visibility
siteInput.addEventListener('input', () => {
  dropZone.classList.toggle('has-content', siteInput.value.trim().length > 0);
});

// Drag & drop text files
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const text = e.dataTransfer.getData('text/plain');
  if (text) {
    siteInput.value = (siteInput.value ? siteInput.value + '\n' : '') + text;
    dropZone.classList.add('has-content');
    return;
  }
  // File drop
  for (const file of e.dataTransfer.files) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      siteInput.value = (siteInput.value ? siteInput.value + '\n' : '') + ev.target.result;
      dropZone.classList.add('has-content');
    };
    reader.readAsText(file);
  }
});

function clearAll() {
  siteInput.value = '';
  dropZone.classList.remove('has-content');
  siteInput.focus();
}

// State
let totalSites = 0;
let doneSites = 0;
let allResults = [];

function addLog(msg, cls='') {
  const feed = document.getElementById('log-feed');
  const now = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<span class="log-time">${now}</span><span class="log-msg">${cls ? `<span class="${cls}">${msg}</span>` : msg}</span>`;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function updateProgress() {
  const pct = totalSites > 0 ? Math.round((doneSites / totalSites) * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function addSiteCard(siteKey, rootUrl, status) {
  const container = document.getElementById('site-cards');
  const id = 'card-' + siteKey.replace(/[^a-z0-9]/gi, '_');
  let card = document.getElementById(id);
  if (!card) {
    card = document.createElement('div');
    card.id = id;
    card.className = 'site-card status-running';
    card.innerHTML = `
      <div class="site-status-dot"></div>
      <div class="site-info">
        <div class="site-domain">${siteKey}</div>
        <div class="site-meta">${rootUrl}</div>
      </div>
      <div class="site-stats">crawling…</div>
    `;
    container.appendChild(card);
  }
  return card;
}

function updateSiteCard(result) {
  const siteKey = result.site_key;
  const id = 'card-' + siteKey.replace(/[^a-z0-9]/gi, '_');
  let card = document.getElementById(id);
  if (!card) {
    card = addSiteCard(siteKey, result.root_url, result.status);
  }

  const isOk = result.status === 'ok' || result.status === 'skipped_existing';
  const isError = result.status === 'no_output' || result.status === 'invalid_url';

  card.className = 'site-card ' + (isOk ? 'status-ok' : isError ? 'status-error' : 'status-skipped');

  const charsStr = result.total_chars > 0 ? `<span class="chars">${(result.total_chars/1000).toFixed(1)}k</span> chars` : '—';
  card.querySelector('.site-stats').innerHTML = `${result.pages_saved}pg · ${charsStr} · ${result.duration_sec}s`;

  if (result.status === 'skipped_existing') {
    card.querySelector('.site-meta').textContent = result.root_url + '  (cached)';
  }
}

async function startScrape() {
  const sitesText = siteInput.value.trim();
  if (!sitesText) return;

  const btn = document.getElementById('scrape-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Running…';

  document.getElementById('results-panel').classList.remove('hidden');
  document.getElementById('summary-bar').classList.add('hidden');
  document.getElementById('site-cards').innerHTML = '';
  document.getElementById('log-feed').innerHTML = '';
  document.getElementById('results-title').textContent = 'Running…';
  document.getElementById('progress-bar').style.width = '0%';
  totalSites = 0;
  doneSites = 0;
  allResults = [];

  const body = {
    sites: sitesText,
    max_pages: document.getElementById('max-pages').value,
    max_depth: document.getElementById('max-depth').value,
    max_seconds: document.getElementById('max-seconds').value,
    max_workers: document.getElementById('max-workers').value,
  };

  try {
    const res = await fetch('/api/scrape', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.error) { addLog(data.error, 'err'); btn.disabled = false; btn.textContent = '▶ Scrape'; return; }

    document.getElementById('run-badge').textContent = 'run:' + data.run_id;
    addLog(`Scrape started — ${data.sites_count} sites queued`);

    // SSE
    const evtSource = new EventSource(`/api/events/${data.run_id}`);
    evtSource.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      if (msg.type === 'run_info') {
        totalSites = msg.data.total_sites;
        addLog(`${totalSites} unique sites to crawl`);
      }
      else if (msg.type === 'site_start') {
        addSiteCard(msg.data.site_key, msg.data.root_url, 'running');
        addLog(`→ ${msg.data.site_key}`);
      }
      else if (msg.type === 'page_done') {
        const s = msg.data.status === 'ok' ? 'ok' : 'warn';
        if (msg.data.status === 'ok') {
          addLog(`  ✓ ${msg.data.url.substring(0,80)} — ${msg.data.chars} chars`, 'ok');
        }
      }
      else if (msg.type === 'site_done') {
        doneSites++;
        updateProgress();
        updateSiteCard(msg.data);
        allResults.push(msg.data);
        const st = msg.data.status === 'ok' ? 'ok' : (msg.data.status === 'skipped_existing' ? '' : 'err');
        addLog(`✔ ${msg.data.site_key} — ${msg.data.pages_saved} pages, ${msg.data.total_chars} chars`, st);
      }
      else if (msg.type === 'error') {
        addLog(msg.data.error, 'err');
      }
      else if (msg.type === 'run_complete' || msg.type === 'done') {
        evtSource.close();
        btn.disabled = false;
        btn.textContent = '▶ Scrape';
        document.getElementById('results-title').textContent = 'Complete';
        document.getElementById('progress-bar').style.width = '100%';
        showSummary();
      }
    };
    evtSource.onerror = () => {
      evtSource.close();
      btn.disabled = false;
      btn.textContent = '▶ Scrape';
    };

  } catch (err) {
    addLog('Failed to start: ' + err, 'err');
    btn.disabled = false;
    btn.textContent = '▶ Scrape';
  }
}

function showSummary() {
  const bar = document.getElementById('summary-bar');
  bar.classList.remove('hidden');
  const sites = allResults.length;
  const pages = allResults.reduce((a,r) => a + (r.pages_saved||0), 0);
  const chars = allResults.reduce((a,r) => a + (r.total_chars||0), 0);
  const secs = allResults.reduce((a,r) => a + (r.duration_sec||0), 0);
  document.getElementById('sum-sites').textContent = sites;
  document.getElementById('sum-pages').textContent = pages;
  document.getElementById('sum-chars').textContent = chars > 1000 ? (chars/1000).toFixed(0) + 'k' : chars;
  document.getElementById('sum-time').textContent = secs.toFixed(0) + 's';
}
</script>
</body>
</html>
